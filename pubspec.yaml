name: student_app
description: "A comprehensive student companion app for academics, wellness, and interview prep."
publish_to: 'none'
version: 1.0.0+1

environment:
    sdk: '>=3.3.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.6
    google_fonts: ^6.2.0
    provider: ^6.1.2

    # Modern package configurations
    file_picker: ^8.1.2
    syncfusion_flutter_pdf: ^25.1.39
    google_generative_ai: ^0.4.3

    table_calendar: ^3.1.1
    intl: ^0.19.0
    fl_chart: ^0.68.0
    shared_preferences: ^2.3.0
    http: ^1.6.0
    supabase_flutter: ^2.14.1

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^3.0.0

flutter:
    uses-material-design: true